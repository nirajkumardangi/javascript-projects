<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SignUp Form Validation</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <form id="signupForm">
    Name: <input id="user" type="text" name="username" id="name" required placeholder="Username"><br><br>
    Email: <input id="email" type="email" name="email" id="email" required placeholder="Email"><br><br>
    Password: <input id="pass" type="password" name="" id="password" required placeholder="Password"><br><br>
    <button type="submit">Submit</button>
    <span id="error-msg"></span>
  </form>

  <script src="script.js"></script>
</body>

</html>
